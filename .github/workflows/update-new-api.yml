name: Update New API Formula

on:
  schedule:
    - cron: "23 8 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    runs-on: macos-latest
    env:
      HOMEBREW_NO_AUTO_UPDATE: "1"
    steps:
      - name: Check out tap
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Select the newest supported upstream release
        id: select
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api 'repos/QuantumNous/new-api/releases?per_page=100' > "$RUNNER_TEMP/releases.json"
          ruby scripts/update_formula.rb select "$RUNNER_TEMP/releases.json" >> "$GITHUB_OUTPUT"

      - name: Verify the official macOS arm64 release asset
        if: steps.select.outputs.update_available == 'true'
        env:
          TAG: ${{ steps.select.outputs.tag }}
          ASSET_NAME: ${{ steps.select.outputs.asset_name }}
          ASSET_URL: ${{ steps.select.outputs.asset_url }}
          ASSET_SHA256: ${{ steps.select.outputs.asset_sha256 }}
        run: |
          curl --fail --location --retry 3 "$ASSET_URL" -o "$RUNNER_TEMP/$ASSET_NAME"
          curl --fail --location --retry 3 "https://github.com/QuantumNous/new-api/releases/download/$TAG/checksums-macos.txt" -o "$RUNNER_TEMP/checksums-macos.txt"
          actual_sha="$(shasum -a 256 "$RUNNER_TEMP/$ASSET_NAME" | awk '{print $1}')"
          test "$actual_sha" = "$ASSET_SHA256"
          listed_sha="$(awk -v name="$ASSET_NAME" '$2 == name {print $1}' "$RUNNER_TEMP/checksums-macos.txt")"
          test "$listed_sha" = "$actual_sha"
          file "$RUNNER_TEMP/$ASSET_NAME" | grep -q 'Mach-O'
          architectures="$(lipo -archs "$RUNNER_TEMP/$ASSET_NAME")"
          case " $architectures " in
            *" arm64 "*) ;;
            *) echo "Expected a macOS arm64 asset; got: $architectures" >&2; exit 1 ;;
          esac

      - name: Hash the pinned source archive
        if: steps.select.outputs.update_available == 'true'
        id: source
        env:
          SOURCE_URL: ${{ steps.select.outputs.source_url }}
        run: |
          curl --fail --location --retry 3 "$SOURCE_URL" -o "$RUNNER_TEMP/new-api-source.tar.gz"
          tar -tzf "$RUNNER_TEMP/new-api-source.tar.gz" | grep -Eq '/main\.go$'
          tar -tzf "$RUNNER_TEMP/new-api-source.tar.gz" | grep -Eq '/web/package\.json$'
          echo "sha256=$(shasum -a 256 "$RUNNER_TEMP/new-api-source.tar.gz" | awk '{print $1}')" >> "$GITHUB_OUTPUT"

      - name: Update the pinned Formula
        if: steps.select.outputs.update_available == 'true'
        env:
          VERSION: ${{ steps.select.outputs.version }}
          SOURCE_SHA256: ${{ steps.source.outputs.sha256 }}
        run: ruby scripts/update_formula.rb update "$VERSION" "$SOURCE_SHA256"

      - name: Validate Formula syntax and style
        if: steps.select.outputs.update_available == 'true'
        run: |
          ruby -c Formula/new-api.rb
          brew style Formula/new-api.rb

      - name: Stage the candidate update for Homebrew validation
        if: steps.select.outputs.update_available == 'true'
        env:
          VERSION: ${{ steps.select.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B automation/update-new-api
          git add Formula/new-api.rb
          git commit -m "new-api: update to $VERSION"

      - name: Register and trust the candidate tap
        if: steps.select.outputs.update_available == 'true'
        run: |
          brew tap KaranocaVe/new-api "$GITHUB_WORKSPACE"
          brew trust --formula KaranocaVe/new-api/new-api

      - name: Audit the candidate Formula
        if: steps.select.outputs.update_available == 'true'
        run: brew audit --strict KaranocaVe/new-api/new-api

      - name: Build and install the candidate from source
        if: steps.select.outputs.update_available == 'true'
        run: brew install --build-from-source KaranocaVe/new-api/new-api

      - name: Test the candidate executable and architecture
        if: steps.select.outputs.update_available == 'true'
        run: |
          brew test KaranocaVe/new-api/new-api
          binary="$(brew --prefix)/opt/new-api/bin/new-api"
          file "$binary" | grep -q 'Mach-O'
          architectures="$(lipo -archs "$binary")"
          case " $architectures " in
            *" arm64 "*) ;;
            *) echo "Expected an arm64 executable; got: $architectures" >&2; exit 1 ;;
          esac

      - name: Verify the candidate launchd service and SQLite persistence
        if: steps.select.outputs.update_available == 'true'
        run: |
          cleanup() { brew services stop new-api >/dev/null 2>&1 || true; }
          trap cleanup EXIT
          brew services start new-api
          state="$(brew --prefix)/var/new-api"
          ready=false
          for _ in {1..60}; do
            if curl --fail --silent --output /dev/null http://127.0.0.1:3000/; then
              ready=true
              break
            fi
            sleep 2
          done
          test "$ready" = true
          lsof -nP -iTCP:3000 -sTCP:LISTEN | grep -F '127.0.0.1:3000'
          test "$(stat -f '%Lp' "$state/.env")" = "600"
          database="$state/data/new-api.db"
          test -s "$database"
          test "$(sqlite3 -readonly "$database" 'PRAGMA journal_mode;')" = "wal"
          curl --fail --silent --show-error http://127.0.0.1:3000/api/setup | jq -e '.data.status == false and .data.database_type == "sqlite" and .data.root_init == false'
          password="$(openssl rand -hex 24)"
          payload="$(jq -n --arg password "$password" '{username:"brewtest",password:$password,confirmPassword:$password,SelfUseModeEnabled:true,DemoSiteEnabled:false}')"
          curl --fail --silent --show-error -H 'Content-Type: application/json' -d "$payload" http://127.0.0.1:3000/api/setup | jq -e '.success == true'
          before="$(sqlite3 -readonly "$database" 'SELECT COUNT(*) FROM users;')"
          test "$before" = "1"
          brew services restart new-api
          ready=false
          for _ in {1..60}; do
            if curl --fail --silent --output /dev/null http://127.0.0.1:3000/; then
              ready=true
              break
            fi
            sleep 2
          done
          test "$ready" = true
          after="$(sqlite3 -readonly "$database" 'SELECT COUNT(*) FROM users;')"
          test "$before" = "$after"
          brew services list

      - name: Open or update the version bump pull request
        if: steps.select.outputs.update_available == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.select.outputs.version }}
          TAG: ${{ steps.select.outputs.tag }}
          ASSET_SHA256: ${{ steps.select.outputs.asset_sha256 }}
          SOURCE_SHA256: ${{ steps.source.outputs.sha256 }}
        run: |
          gh auth setup-git
          git push --force origin HEAD:automation/update-new-api
          pr_number="$(gh pr list --state open --head automation/update-new-api --json number --jq '.[0].number // empty')"
          body="Tracks upstream $TAG. Verified official macOS arm64 asset SHA-256 $ASSET_SHA256; the Formula builds the patched source archive with SHA-256 $SOURCE_SHA256."
          if [[ -n "$pr_number" ]]; then
            gh pr edit "$pr_number" --title "new-api: update to $VERSION" --body "$body"
          else
            gh pr create --base main --head automation/update-new-api --title "new-api: update to $VERSION" --body "$body"
          fi

      - name: Report no update
        if: steps.select.outputs.update_available != 'true'
        env:
          SELECTED_TAG: ${{ steps.select.outputs.selected_tag }}
          SKIPPED_TAGS: ${{ steps.select.outputs.skipped_without_macos }}
        run: |
          echo "No newer verified macOS release is available; current Formula is already at the highest compatible release ($SELECTED_TAG)."
          if [[ -n "$SKIPPED_TAGS" ]]; then
            echo "Skipped supported releases without an exact macOS asset: $SKIPPED_TAGS"
          fi
