name: Formula CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  macos-arm64:
    runs-on: macos-latest
    env:
      HOMEBREW_NO_AUTO_UPDATE: "1"
    steps:
      - name: Check out tap
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Verify runner architecture
        run: test "$(uname -m)" = "arm64"

      - name: Check Ruby syntax and Formula style
        run: |
          ruby -c Formula/new-api.rb
          brew style Formula/new-api.rb

      - name: Register the checked out tap with Homebrew
        run: brew tap KaranocaVe/new-api "$GITHUB_WORKSPACE"

      - name: Trust the tap Formula for this CI run
        run: brew trust --formula KaranocaVe/new-api/new-api

      - name: Audit the Formula
        run: brew audit --strict KaranocaVe/new-api/new-api

      - name: Build and install Formula from source
        run: brew install --build-from-source KaranocaVe/new-api/new-api

      - name: Test the installed executable
        run: brew test KaranocaVe/new-api/new-api

      - name: Verify Apple Silicon executable
        run: |
          binary="$(brew --prefix)/opt/new-api/bin/new-api"
          file "$binary" | grep -q 'Mach-O'
          architectures="$(lipo -archs "$binary")"
          case " $architectures " in
            *" arm64 "*) ;;
            *) echo "Expected an arm64 executable; got: $architectures" >&2; exit 1 ;;
          esac

      - name: Verify launchd service and persistent SQLite data
        run: |
          cleanup() { brew services stop new-api >/dev/null 2>&1 || true; }
          trap cleanup EXIT
          brew services start new-api
          state="$(brew --prefix)/var/new-api"
          ready=false
          for _ in {1..60}; do
            if curl --fail --silent --output /dev/null http://127.0.0.1:3000/; then
              ready=true
              break
            fi
            sleep 2
          done
          test "$ready" = true
          lsof -nP -iTCP:3000 -sTCP:LISTEN | grep -F '127.0.0.1:3000'
          test "$(stat -f '%Lp' "$state/.env")" = "600"
          database="$state/data/new-api.db"
          test -s "$database"
          test "$(sqlite3 -readonly "$database" 'PRAGMA journal_mode;')" = "wal"
          curl --fail --silent --show-error http://127.0.0.1:3000/api/setup | jq -e '.data.status == false and .data.database_type == "sqlite" and .data.root_init == false'
          password="$(openssl rand -hex 24)"
          payload="$(jq -n --arg password "$password" '{username:"brewtest",password:$password,confirmPassword:$password,SelfUseModeEnabled:true,DemoSiteEnabled:false}')"
          curl --fail --silent --show-error -H 'Content-Type: application/json' -d "$payload" http://127.0.0.1:3000/api/setup | jq -e '.success == true'
          before="$(sqlite3 -readonly "$database" 'SELECT COUNT(*) FROM users;')"
          test "$before" = "1"
          brew services restart new-api
          ready=false
          for _ in {1..60}; do
            if curl --fail --silent --output /dev/null http://127.0.0.1:3000/; then
              ready=true
              break
            fi
            sleep 2
          done
          test "$ready" = true
          after="$(sqlite3 -readonly "$database" 'SELECT COUNT(*) FROM users;')"
          test "$before" = "$after"
          brew services list
